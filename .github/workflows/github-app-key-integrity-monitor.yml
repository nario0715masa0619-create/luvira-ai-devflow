name: GitHub App key integrity monitor

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  verify-active-key:
    name: GitHub App key lifecycle integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ai-reviewer-oidc@luvira-ai-control-plane.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify registration, proof, and active promotion state
        id: integrity
        continue-on-error: true
        env:
          GITHUB_APP_ID: '4802527'
        run: |
          key_file="$RUNNER_TEMP/github-app-key.pem"
          trap 'rm -f "$key_file"' EXIT
          gcloud secrets versions access latest \
            --secret github-app-luvirai-reviewer-private-key \
            --project luvira-ai-control-plane > "$key_file"
          node .github/scripts/verify-github-app-key.mjs "$key_file"
      - name: Block and open an incident on integrity failure
        if: steps.integrity.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'SECURITY: GitHub App key lifecycle integrity failure';
            const body = [
              'Automated monitoring could not prove the active GitHub App key is complete and can authenticate the intended App.',
              '',
              'The reviewer and webhook configuration must be treated as blocked until a staged key rotation completes.',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'security', per_page: 100,
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['security', 'incident'] });
            }
            core.setFailed('KEY_INTEGRITY_BLOCKED: active GitHub App key failed lifecycle verification');
