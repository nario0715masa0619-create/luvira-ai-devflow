name: Deploy DevFlow staging

on:
  workflow_dispatch:

# This workflow is manual-only and uses the protected GitHub Environment
# named `staging`.  It never shares the production service names, Firestore
# collections, Worker Job, or artifact bucket.
concurrency:
  group: deploy-luvira-devflow-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_DEPLOYER_SERVICE_ACCOUNT }}
          audience: https://github.com/nario0715masa0619-create
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build isolated images in staging only
        run: |
          set -euo pipefail
          ORCHESTRATOR_IMAGE="${{ vars.STAGING_REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/luvira-devflow/luvira-devflow-orchestrator-staging:${GITHUB_SHA}"
          WORKER_IMAGE="${{ vars.STAGING_REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/luvira-devflow/luvira-devflow-isolated-worker-staging:${GITHUB_SHA}"
          submit_and_wait() {
            build_id="$(gcloud builds submit "$@" --project "${{ vars.STAGING_PROJECT_ID }}" --async --quiet --format='value(id)')"
            for attempt in $(seq 1 120); do
              status="$(gcloud builds describe "$build_id" --project "${{ vars.STAGING_PROJECT_ID }}" --format='value(status)')"
              [ "$status" = "SUCCESS" ] && return 0
              case "$status" in FAILURE|CANCELLED|EXPIRED|TIMEOUT) return 1 ;; esac
              sleep 5
            done
            echo "Cloud Build did not finish within 10 minutes: $build_id" >&2
            return 1
          }
          submit_and_wait orchestrator --tag "$ORCHESTRATOR_IMAGE" --gcs-source-staging-dir "gs://${{ vars.STAGING_SOURCE_BUCKET }}/orchestrator"
          submit_and_wait . --config worker/cloudbuild.bootstrap.yaml --substitutions "_IMAGE=$WORKER_IMAGE" --gcs-source-staging-dir "gs://${{ vars.STAGING_SOURCE_BUCKET }}/worker"
      - name: Deploy private staging orchestrator
        run: |
          set -euo pipefail
          IMAGE="${{ vars.STAGING_REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/luvira-devflow/luvira-devflow-orchestrator-staging:${GITHUB_SHA}"
          gcloud run deploy luvira-devflow-orchestrator-staging \
            --project "${{ vars.STAGING_PROJECT_ID }}" --region "${{ vars.STAGING_REGION }}" \
            --image "$IMAGE" --timeout 3600 --no-allow-unauthenticated --quiet \
            --service-account "${{ vars.STAGING_ORCHESTRATOR_SERVICE_ACCOUNT }}" \
            --update-env-vars EXPECTED_REPOSITORY=nario0715masa0619-create/luvira-ai-devflow,V3_TASK_COLLECTION=devflow_staging_execution_tasks,V3_VERIFIED_ARTIFACT_COLLECTION=devflow_staging_verified_artifacts,V3_IMPLEMENTATION_ARTIFACT_COLLECTION=devflow_staging_verified_implementation_artifacts,V3_RUNTIME_HEALTH_COLLECTION=devflow_staging_runtime_health,BROKER_SERVICE_ACCOUNT=${{ vars.STAGING_ORCHESTRATOR_SERVICE_ACCOUNT }},ISOLATED_WORKER_JOB=luvira-devflow-isolated-worker-bootstrap-staging,ISOLATED_WORKER_REGION=${{ vars.STAGING_REGION }},ISOLATED_WORKER_ARTIFACT_BUCKET=${{ vars.STAGING_ARTIFACT_BUCKET }},ISOLATED_WORKER_ARTIFACT_VIEW=bootstrap-results
      - name: Deploy isolated staging Worker
        run: |
          set -euo pipefail
          IMAGE="${{ vars.STAGING_REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/luvira-devflow/luvira-devflow-isolated-worker-staging:${GITHUB_SHA}"
          if gcloud run jobs describe luvira-devflow-isolated-worker-bootstrap-staging --project "${{ vars.STAGING_PROJECT_ID }}" --region "${{ vars.STAGING_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update luvira-devflow-isolated-worker-bootstrap-staging --project "${{ vars.STAGING_PROJECT_ID }}" --region "${{ vars.STAGING_REGION }}" --image "$IMAGE" --quiet
          else
            gcloud run jobs create luvira-devflow-isolated-worker-bootstrap-staging --project "${{ vars.STAGING_PROJECT_ID }}" --region "${{ vars.STAGING_REGION }}" --image "$IMAGE" --service-account "${{ vars.STAGING_WORKER_SERVICE_ACCOUNT }}" --quiet
          fi
