name: Luvira Context Lock preflight

on:
  workflow_call:
    inputs:
      context_lock_path:
        description: Path to the caller repository Context Lock JSON file.
        required: true
        type: string
      requested_action:
        description: Action requested by the caller.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Context Lock (read-only)
        shell: bash
        run: |
          node scripts/validate-context-lock.js "${{ inputs.context_lock_path }}" "${{ inputs.requested_action }}" "${{ github.repository }}"
