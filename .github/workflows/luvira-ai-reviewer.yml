name: Luvira AI reviewer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review.
        required: true
        type: number

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  review:
    name: Independent AI review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # Review code comes only from the trusted base commit. Never check out PR code.
      - name: Check out the trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate with GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ai-reviewer-oidc@luvira-ai-control-plane.iam.gserviceaccount.com
      - name: Perform an independent AI review
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          gcloud secrets versions access latest \
            --secret github-app-luvirai-reviewer-private-key \
            --project luvira-ai-control-plane \
            | node .github/scripts/independent-ai-review.mjs
