name: Authorize approved DevFlow task

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub approval Issue number; task facts are resolved server-side
        required: true
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  authorize:
    # GitHub supplies the protected human decision.  The v3 Control Plane is
    # the sole owner of the atomic authorization-and-queue state transition.
    environment: human-approval
    runs-on: ubuntu-latest
    steps:
      # Discover the current canonical Cloud Run URL.  Do not hard-code a
      # run.app hostname: its hash is assigned by Cloud Run and can differ
      # across service recreation or project migration.
      - uses: google-github-actions/auth@v2
        id: discovery_auth
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github-human-approval
          service_account: devflow-human-approval@luvira-ai-control-plane.iam.gserviceaccount.com
          audience: https://github.com/nario0715masa0619-create
      - name: Discover the canonical orchestrator endpoint
        id: orchestrator
        run: |
          set -euo pipefail
          url="$(gcloud run services describe luvira-devflow-orchestrator \
            --region us-central1 \
            --project luvira-ai-control-plane \
            --format='value(status.url)')"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        id: request_auth
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github-human-approval
          service_account: devflow-human-approval@luvira-ai-control-plane.iam.gserviceaccount.com
          audience: https://github.com/nario0715masa0619-create
          token_format: id_token
          id_token_audience: ${{ steps.orchestrator.outputs.url }}
          id_token_include_email: true
      - name: Record the immutable human authorization
        env:
          ID_TOKEN: ${{ steps.request_auth.outputs.id_token }}
          ORCHESTRATOR_URL: ${{ steps.orchestrator.outputs.url }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          pending="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ID_TOKEN" \
            "$ORCHESTRATOR_URL/control-plane/v3/approval-issues/$ISSUE_NUMBER/pending")"
          test "$(jq --raw-output '.status' <<<"$pending")" = "AWAITING_HUMAN_APPROVAL"
          TASK_ID="$(jq --raw-output '.task_id' <<<"$pending")"
          APPROVAL_BINDING="$(jq --raw-output '.approval_binding' <<<"$pending")"
          test "$TASK_ID" != "null" && test "$APPROVAL_BINDING" != "null"
          body="$(jq -n --arg approval_binding "$APPROVAL_BINDING" --arg actor "$ACTOR" '{approval_binding: $approval_binding, actor: $actor}')"
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "$ORCHESTRATOR_URL/control-plane/v3/tasks/$TASK_ID/authorize")"
          test "$(jq --raw-output '.status' <<<"$response")" = "AUTHORIZED"
