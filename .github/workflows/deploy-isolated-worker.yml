name: Deploy isolated DevFlow worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "orchestrator/isolated_worker.py"
      - ".github/workflows/deploy-isolated-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-luvira-devflow-isolated-worker-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github-deployer
          service_account: devflow-deployer@luvira-ai-control-plane.iam.gserviceaccount.com
          audience: https://github.com/nario0715masa0619-create
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the pinned isolated Worker image
        run: |
          build_id="$(gcloud builds submit . \
            --config worker/cloudbuild.bootstrap.yaml \
            --substitutions _IMAGE=us-central1-docker.pkg.dev/luvira-ai-control-plane/cloud-run-source-deploy/luvira-devflow-isolated-worker:${GITHUB_SHA} \
            --gcs-source-staging-dir gs://luvira-devflow-source-660319628285/source \
            --async --quiet --format='value(id)')"
          for attempt in $(seq 1 60); do
            status="$(gcloud builds describe "$build_id" --format='value(status)')"
            [ "$status" = "SUCCESS" ] && break
            [ "$status" = "FAILURE" ] || [ "$status" = "CANCELLED" ] || [ "$status" = "EXPIRED" ] && exit 1
            sleep 5
          done
          [ "$status" = "SUCCESS" ]
      - name: Update only the reviewed Worker image
        run: |
          gcloud run jobs update luvira-devflow-isolated-worker-bootstrap \
            --project luvira-ai-control-plane --region us-central1 \
            --image us-central1-docker.pkg.dev/luvira-ai-control-plane/cloud-run-source-deploy/luvira-devflow-isolated-worker:${GITHUB_SHA} \
            --quiet
      - name: Verify the Worker remains ready and isolated
        run: |
          job="$(gcloud run jobs describe luvira-devflow-isolated-worker-bootstrap \
            --project luvira-ai-control-plane --region us-central1 --format=json)"
          test "$(jq --raw-output '.status.conditions[] | select(.type == "Ready") | .status' <<<"$job")" = "True"
          test "$(jq --raw-output '.spec.template.spec.template.spec.serviceAccountName' <<<"$job")" = "devflow-isolated-worker@luvira-ai-control-plane.iam.gserviceaccount.com"
