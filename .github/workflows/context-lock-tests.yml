name: Context Lock tests

on:
  pull_request:
    paths:
      - '.github/workflows/luvira-context-lock-preflight.yml'
      - '.github/workflows/independent-review-monitor-on-pr.yml'
      - 'scripts/validate-context-lock.js'
      - 'tests/validate-context-lock.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/luvira-context-lock-preflight.yml'
      - '.github/workflows/independent-review-monitor-on-pr.yml'
      - 'scripts/validate-context-lock.js'
      - 'tests/validate-context-lock.test.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-context-lock.test.js
