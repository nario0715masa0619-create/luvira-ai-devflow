name: Deploy Luvira DevFlow orchestrator

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github-deployer
          service_account: devflow-deployer@luvira-ai-control-plane.iam.gserviceaccount.com
          audience: https://github.com/nario0715masa0619-create
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud run deploy luvira-devflow-orchestrator --source orchestrator --region us-central1 --no-allow-unauthenticated --service-account devflow-orchestrator@luvira-ai-control-plane.iam.gserviceaccount.com
