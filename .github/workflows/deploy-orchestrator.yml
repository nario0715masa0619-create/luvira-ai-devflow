name: Deploy Luvira DevFlow orchestrator

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/660319628285/locations/global/workloadIdentityPools/github-actions/providers/github-deployer
          service_account: devflow-deployer@luvira-ai-control-plane.iam.gserviceaccount.com
          audience: https://github.com/nario0715masa0619-create
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the container in the dedicated staging bucket
        run: |
          build_id="$(gcloud builds submit orchestrator \
            --tag us-central1-docker.pkg.dev/luvira-ai-control-plane/cloud-run-source-deploy/luvira-devflow-orchestrator:${GITHUB_SHA} \
            --gcs-source-staging-dir gs://luvira-devflow-source-660319628285/source \
            --async --quiet --format='value(id)')"
          for attempt in $(seq 1 60); do
            status="$(gcloud builds describe "$build_id" --format='value(status)')"
            [ "$status" = "SUCCESS" ] && break
            [ "$status" = "FAILURE" ] || [ "$status" = "CANCELLED" ] || [ "$status" = "EXPIRED" ] && exit 1
            sleep 5
          done
          [ "$status" = "SUCCESS" ]
      - name: Deploy the reviewed container
        run: |
          gcloud run deploy luvira-devflow-orchestrator \
            --image us-central1-docker.pkg.dev/luvira-ai-control-plane/cloud-run-source-deploy/luvira-devflow-orchestrator:${GITHUB_SHA} \
            --region us-central1 --no-allow-unauthenticated --quiet \
            --service-account devflow-orchestrator@luvira-ai-control-plane.iam.gserviceaccount.com \
            --update-env-vars GITHUB_WORKER_APP_ID=4823016,GITHUB_WORKER_INSTALLATION_ID=158901090 \
            --set-secrets OPENCODE_GO_API_KEY=opencode-go-api-key:latest,GITHUB_WORKER_PRIVATE_KEY=github-app-luvirai-worker-private-key:latest,GITHUB_WEBHOOK_SECRET=github-webhook-signing-secret:latest
