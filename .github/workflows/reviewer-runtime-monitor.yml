name: Reviewer runtime monitor

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  monitor:
    name: Reviewer runtime integrity
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted runtime policy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow = await github.rest.repos.getContent({
              owner, repo, path: '.github/workflows/luvira-ai-reviewer.yml', ref: 'main'
            });
            const text = Buffer.from(workflow.data.content, 'base64').toString('utf8');
            if (!text.includes('ref: main') || text.includes('base.sha')) {
              core.setFailed('REVIEWER_RUNTIME_BLOCKED: reviewer must execute the current trusted main runtime');
            }
            const checks = await github.rest.checks.listForRef({
              owner, repo, ref: context.payload.pull_request.head.sha, per_page: 100
            });
            const review = checks.data.check_runs.filter(run => run.name === 'Independent AI review').at(-1);
            if (review?.status === 'completed' && review.conclusion !== 'success') {
              core.setFailed(`REVIEWER_RUNTIME_BLOCKED: independent review ended ${review.conclusion}`);
            }
